[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zahlenwerk-auswertung"
version = "0.1.0"
description = "Auswertungskern des Zahlenwerk-Kundenportals"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
pdf = ["weasyprint>=68"]
test = ["pytest>=8", "weasyprint>=68"]

[tool.setuptools]
packages = ["auswertung"]

[tool.pytest.ini_options]
testpaths = ["tests"]
