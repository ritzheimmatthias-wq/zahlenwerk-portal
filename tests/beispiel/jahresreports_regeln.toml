# Fiktive Report-Konfiguration für das Pilotobjekt. Alle Grenzen sind fachlich änderbar
# und erscheinen in jedem Report. Beträge und Quoten als Text.

[regeln]
rundung_auf = "1.00"          # Vorschlag auf volle Euro
rundungsart = "kaufmaennisch" # oder "aufrunden"
bagatelle_betrag = "5.00"     # je Monat
bagatelle_prozent = "0.05"    # der aktuellen Vorauszahlung
mindest_nutzungstage = 180
treiber_prozent = "0.10"
treiber_betrag = "100.00"
top_anzahl = 5

# Nur freigegebene Änderungen fließen als getrennt ausgewiesene Annahme ein.
[[kostenaenderungen]]
id = "KA-2027-01"
