begruendung = "Neuer Grundsteuerbescheid ab 2027 (fiktiv)"
beleg = "BEL-GS-2027 (fiktiv)"
gilt_ab = 2027-01-01
freigegeben_von = "Zahlenwerk Prüfung (fiktiv)"
freigegeben_am = 2026-11-02

